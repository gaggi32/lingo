[package]
name = "lingo"
version = "1.0.0"
description = "Lingo — pop-up translator powered by the Google Cloud Translation API"
authors = ["gaggi32"]
edition = "2021"
rust-version = "1.77.2"

# `main.rs` (and any mobile entry point) calls into this library.
[lib]
name = "lingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
# rustls rather than native-tls: one less system dependency to satisfy when
# building on Linux, and identical behaviour on Windows/macOS.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Installs a signed release from inside the app (public key in tauri.conf.json).
tauri-plugin-updater = "2"

# The API key lives in the OS credential store: DPAPI-backed Credential Manager
# on Windows, the Keychain on macOS. Linux keeps it in settings.json (see
# secret.rs), so the crate is not built there at all.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
